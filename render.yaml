services:
  - type: web
    name: clandraft
    runtime: static
    # Raw data stores (raid stats, game provenance, nudge output, compressed
    # screenshots) stay in the repo but are stripped from the published site.
    buildCommand: "rm -rf RaidStats.csv Games.csv NudgeReport.csv Screenshots"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
